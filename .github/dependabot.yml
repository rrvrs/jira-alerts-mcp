# Dependency updates.
#
# Grouped deliberately: five separate patch-bump PRs a week is how people learn
# to stop reading them. One grouped PR per ecosystem stays reviewable, and a
# major version still arrives on its own because that is the one that breaks.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

    # Raise the declared range along with the lockfile, not just the lockfile.
    #
    # check-manifests.mjs asserts that every declared floor is >= the version
    # actually installed, because a floor that rots below what we run is a
    # promise we never tested. Dependabot's npm default is
    # increase-if-necessary, which leaves package.json alone whenever the
    # existing range already admits the new version — ^1.19.0 happily resolves
    # 1.20.0 — so a minor bump lands as a lockfile-only diff and fails that
    # check every time. `increase` is the strategy that agrees with the policy.
    versioning-strategy: increase
    labels: [dependencies]
    groups:
      # The SDK is the one dependency whose minor releases change behaviour we
      # rely on, so it is not grouped with everything else.
      mcp-sdk:
        patterns: ['@modelcontextprotocol/*']
      production:
        dependency-type: production
        exclude-patterns: ['@modelcontextprotocol/*']
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, github-actions]
    groups:
      actions:
        patterns: ['*']
