name: Release

# Publishing is driven by the tag, so the thing that goes to npm is exactly the
# commit that was tagged — not whatever happened to be in a maintainer's working
# directory. RELEASING.md used to be six local commands; the risky two are here.
on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Write, because the last step creates the GitHub Release for this tag.
      contents: write
      # Required for npm trusted publishing (OIDC) and for the provenance
      # attestation. No NPM_TOKEN secret is involved.
      id-token: write
      # For the GitHub Packages mirror only. npmjs does not use this.
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned to 24 deliberately, and not tied to the `engines` floor: trusted
      # publishing needs npm >= 11.5.1, and a Node major bundles the npm of its
      # era. Node 22 ships npm 10, which predates the OIDC handshake entirely.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # An npm too old for OIDC does not say so. It fails the handshake, gets
      # treated as an anonymous user, and anonymous users cannot PUT — so the
      # release dies on a bare 404 that points nowhere near the cause. Fail
      # here instead, where the message names the problem.
      - name: Verify npm can use trusted publishing
        run: |
          min=11.5.1; cur="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$min" "$cur" | sort -V | head -1)" != "$min" ]; then
            echo "::error::npm $cur is older than $min — the OIDC handshake would fail as a misleading 404"
            exit 1
          fi
          echo "npm $cur"

      - run: npm ci

      # The tag is not trusted to be releasable just because it exists. Re-run
      # the same gates CI runs before anything leaves the machine.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify manifests agree
        run: node scripts/check-manifests.mjs

      # A tag that disagrees with package.json would publish a version nobody
      # asked for, and npm publishes cannot be taken back.
      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      # Skip rather than fail when the version is already up. Publishes cannot
      # be undone, so a release that fails *after* the publish must be safe to
      # re-run; and the very first release was bootstrapped by hand, because
      # trusted publishing cannot be configured for a package that does not
      # exist yet. The tag-vs-package.json check above already catches the
      # mistake this would otherwise have caught — forgetting to bump.
      - name: Publish
        run: |
          ver="$(node -p 'require("./package.json").version')"
          if npm view "jira-alerts-mcp@$ver" version >/dev/null 2>&1; then
            echo "::notice::$ver is already on the registry; skipping publish"
            exit 0
          fi
          npm publish

      # The registry hosts metadata only: it resolves the npm package named in
      # server.json and checks that package's `mcpName` field matches. So it has
      # to run after the npm publish above — until the version is actually on
      # npmjs there is nothing for it to verify, and it rejects the submission.
      #
      # This used to be a maintainer running `mcp-publisher login github` at a
      # terminal, and the device-code flow is why RELEASING.md called it
      # unautomatable. `login github-oidc` removes that: it uses the same
      # id-token permission npm trusted publishing already needs, and the
      # registry grants the caller `io.github.<repository_owner>/*` — which
      # covers io.github.rrvrs/jira-alerts-mcp. No device code, no secret.
      #
      # It matters that this is automated rather than remembered: the listing
      # sat at 1.0.1 while npmjs was at 1.1.0, because the manual step was
      # missed five releases running.
      #
      # Pinned rather than `latest/download`, for the same reason every action
      # here is pinned by SHA — a release should not pick up a new publisher
      # build the maintainer never chose.
      - name: Publish to the MCP Registry
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          # pipefail because the version lookup below reads through a pipe, and
          # a failed curl would otherwise be read as "not listed yet".
          set -euo pipefail

          ver="$(node -p 'require("./package.json").version')"

          # Skip-if-present, like the npm publish and the mirror. A release that
          # fails after any publish has to be safe to re-run. A lookup failure
          # is not fatal: fall through and let the publish itself decide, rather
          # than abandoning a release because the registry was briefly down.
          listed=""
          if raw="$(curl -fsS --retry 3 'https://registry.modelcontextprotocol.io/v0.1/servers?search=jira-alerts-mcp')"; then
            listed="$(printf '%s' "$raw" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const m=(j.servers||[]).find(e=>e.server&&e.server.name==="io.github.rrvrs/jira-alerts-mcp");console.log(m&&m.server.version?m.server.version:"")})')"
          else
            echo "::warning::could not reach the MCP Registry to check the listed version; attempting the publish anyway"
          fi

          if [ "$listed" = "$ver" ]; then
            echo "::notice::$ver is already listed on the MCP Registry; skipping"
            exit 0
          fi

          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

          # Reads server.json from the working directory. check-manifests.mjs has
          # already asserted it agrees with package.json, and the tag check above
          # has asserted both agree with the tag.
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      # A cosmetic mirror, so the repository's Packages panel is not empty. It is
      # NOT an install route: GitHub Packages requires a personal access token
      # even for public packages, which is why README.md sends people to npmjs.
      #
      # Re-running setup-node is the documented way to authenticate against a
      # second registry, and it is what writes both halves of the config npm
      # needs: the scope-to-registry mapping and the _authToken line keyed to
      # NODE_AUTH_TOKEN. Hand-appending the token line alone is what failed in
      # v1.0.2 with ENEEDAUTH. Safe here only because every npmjs step has
      # already run — this overwrites the npmjs auth it depends on.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@rrvrs'

      # The scope has to match the repo owner, so the mirror cannot carry the
      # npmjs name. Renaming here is safe: package.json is a build artifact from
      # this point on. Provenance is npmjs-only, hence --no-provenance.
      - name: Mirror to GitHub Packages
        run: |
          ver="$(node -p 'require("./package.json").version')"
          if npm view "@rrvrs/jira-alerts-mcp@$ver" version >/dev/null 2>&1; then
            echo "::notice::@rrvrs/jira-alerts-mcp@$ver is already mirrored; skipping"
            exit 0
          fi
          npm pkg set name="@rrvrs/jira-alerts-mcp"
          npm publish --no-provenance
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      # Last, so the announcement only exists once every artifact is out — npm,
      # the registry listing, and the mirror.
      # --verify-tag refuses to invent a release for a tag that is not there.
      # Notes are grouped by PR label per .github/release.yml.
      - name: Create the GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists; skipping"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
