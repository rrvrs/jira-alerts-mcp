name: Release

# Publishing is driven by the tag, so the thing that goes to npm is exactly the
# commit that was tagged — not whatever happened to be in a maintainer's working
# directory. RELEASING.md used to be six local commands; the risky two are here.
on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and for the provenance
      # attestation. No NPM_TOKEN secret is involved.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      # The tag is not trusted to be releasable just because it exists. Re-run
      # the same gates CI runs before anything leaves the machine.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify manifests agree
        run: node scripts/check-manifests.mjs

      # A tag that disagrees with package.json would publish a version nobody
      # asked for, and npm publishes cannot be taken back.
      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Publish
        run: npm publish
