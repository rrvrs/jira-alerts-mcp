name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package.json and server.json agree
        run: node scripts/check-manifests.mjs

      - name: Verify tests are excluded from the published build
        run: |
          leaked=$(find dist \( -name '*.test.js' -o -name '*.test.d.ts' -o -name 'test-support.*' \))
          if [ -n "$leaked" ]; then
            echo "::error::test files leaked into dist/ — check the tsconfig exclude"
            echo "$leaked"
            exit 1
          fi

      - name: Verify the CLI starts and reports its banner
        run: node dist/index.js --help
